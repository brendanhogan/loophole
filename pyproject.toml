[project]
name = "loophole"
version = "0.1.0"
description = "Adversarial moral-legal code system — stress-test ethical principles through adversarial AI agents"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.50.0",
    "openai>=1.0.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.9",
    "pyyaml>=6.0",
]

[project.scripts]
loophole = "loophole.main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loophole*"]
